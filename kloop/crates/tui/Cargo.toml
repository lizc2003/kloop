[package]
name = "kloop-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
kloop-core = { workspace = true }
kloop-process-spawn = { workspace = true }
kloop-protocol = { workspace = true }

anyhow = { workspace = true }
# OS clipboard image paste (Ctrl+V, plan 38 slice 3).
arboard = { workspace = true }
crossterm = { workspace = true }
png = { workspace = true }
# `insert_before` freezes finalized cells into native scrollback for the inline
# viewport (plan 38 slice 0); plan 43 resyncs and redraws after each batch. We
# deliberately do NOT enable the `scrolling-regions` feature: its full-height
# `insert_before` path scrolls one DECSTBM row at a time, which iTerm2 smears in
# scrollback (plan 99). The default path scrolls with LF-at-bottom (append_lines)
# and commits cleanly across terminals.
ratatui = { workspace = true }
# Markdown → styled lines for assistant messages (plan 38 slice 1).
pulldown-cmark = { workspace = true }
# Tool-input parsing to format human-readable tool rows (plan 38 slice 2).
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
synoptic = "2.2.9"
