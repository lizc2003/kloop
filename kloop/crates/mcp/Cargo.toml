[package]
name = "kloop-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
kloop-protocol = { workspace = true }
anyhow = { workspace = true }
# Streamable HTTP transport (plan 34): POST per request, SSE responses. reqwest
# is already compiled for kloop-web/kloop-provider; futures drives the response
# byte stream. kloop-mcp is a leaf used only by the CLI, so this widens no
# layering (core never depends on this crate).
futures = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
