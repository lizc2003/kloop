[package]
name = "kloop-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
kloop-process-spawn = { workspace = true }
kloop-protocol = { workspace = true }
anyhow = { workspace = true }
# Streamable HTTP transport (plan 34): POST per request, SSE responses. reqwest
# is already compiled for kloop-web/kloop-provider; futures drives the response
# byte stream. kloop-mcp is a leaf used only by the CLI, so this widens no
# layering (core never depends on this crate).
futures = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Remote OAuth (plan 34b): serde derives the token/credential wire structs, url
# builds path-aware discovery variants, base64/sha2/getrandom implement PKCE.
serde = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
