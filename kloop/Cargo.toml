[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/provider",
    "crates/core",
    "crates/process-spawn",
    "crates/mcp",
    "crates/web",
    "crates/codemode",
    "crates/cli",
    "crates/tui",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
kloop-core = { path = "crates/core" }
kloop-mcp = { path = "crates/mcp" }
kloop-protocol = { path = "crates/protocol" }
kloop-codemode = { path = "crates/codemode" }
kloop-provider = { path = "crates/provider" }
kloop-process-spawn = { path = "crates/process-spawn" }
kloop-server = { path = "crates/server" }
kloop-tui = { path = "crates/tui" }
kloop-web = { path = "crates/web" }

anyhow = "1"
# OS clipboard image paste in the TUI (plan 38 slice 3): Ctrl+V reads an image
# off the system clipboard (like Claude Code / codex, which reserve Cmd+V for the
# terminal's own text paste). arboard reads it (its macOS backend pulls only
# image[tiff]); `png` encodes the raw RGBA it returns into bytes core validates.
arboard = "3"
png = "0.17"
# Image input (plan 29): standard base64 for the wire `data` field. 3rd
# function dependency (after similar, serde_yaml_ng); base64 is an unambiguous
# standard codec, so a crate beats hand-rolling it. Already in the tree
# transitively (reqwest et al.), so no new compile cost.
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
httpdate = "1"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.46.10", default-features = false }
# Global config/OAuth IO: macOS search-only directory descriptors plus safe
# descriptor-relative no-follow opens and atomic renames.
libc = "0.2"
rustix = { version = "0.38", features = ["fs", "process"] }
# Markdown rendering in the TUI (plan 38 slice 1): parse assistant messages to
# styled ratatui lines. default-features off drops the html/escape + getopts
# (CLI-only) pieces — we only drive the pull parser. Syntax highlighting
# (syntect) is deliberately deferred to a later slice (plan 38 关键决定 2).
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# MCP remote OAuth (plan 34b): PKCE challenge = base64url(sha256(verifier)); a
# CSPRNG for the verifier/state. Both are tiny single-purpose crates (kloop's
# "borrow a small crate, not a framework" line) already resolved in the tree —
# getrandom 0.2 reuses the transitive copy; sha2 is RustCrypto, no new toolchain.
getrandom = "0.2"
sha2 = "0.10"
# QuickJS engine for code-mode. `futures` = AsyncRuntime/AsyncContext, `parallel` =
# Send+Sync handles for the multi-thread tokio runtime, `macro` = the binding macros.
# `bindgen` is deliberately OFF: rquickjs-sys ships pregenerated bindings, so no libclang.
rquickjs = { version = "0.12", default-features = false, features = ["futures", "parallel", "macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Skills frontmatter: parse the SKILL.md YAML block so any spec-compliant skill
# from the ecosystem loads as-is. serde_yaml_ng is the maintained fork of the
# archived serde_yaml; unknown frontmatter keys deserialize away for free.
serde_yaml_ng = "0.10"
similar = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "signal", "fs", "time", "sync", "test-util"] }
tokio-util = "0.7"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-javascript = "0.25"
url = "2"
windows-sys = { version = "0.52", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# test-only
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16.2"
wiremock = "0.6"
