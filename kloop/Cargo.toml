[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/provider",
    "crates/core",
    "crates/mcp",
    "crates/cli",
    "crates/tui",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kloop-core = { path = "crates/core" }
kloop-mcp = { path = "crates/mcp" }
kloop-protocol = { path = "crates/protocol" }
kloop-provider = { path = "crates/provider" }
kloop-server = { path = "crates/server" }
kloop-tui = { path = "crates/tui" }

anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
unicode-width = "0.2"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "signal", "fs", "time", "sync"] }
tokio-util = "0.7"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

# test-only
wiremock = "0.6"
