name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # 仓库根不是 workspace 根,workspace 在 rust/ 下
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: runner.os == 'Windows'
        run: |
          cargo +stable test --locked -p kloop-core file_io::tests
          cargo +stable test --locked -p kloop-core text_edit::tests
          cargo +stable test --locked -p kloop-core tools::fs::tests
          cargo +stable test --locked -p kloop-core tools::fs::windows::tests
          cargo +stable test --locked -p kloop-core diff::tests
          cargo +stable test --locked -p kloop-core file_state::tests
          cargo +stable test --locked -p kloop-core scheduler::tests
          cargo +stable test --locked -p kloop-process-spawn
          cargo +stable test --locked -p kloop-core shell_programs::tests
          cargo +stable test --locked -p kloop-core process_tree
          cargo +stable test --locked -p kloop-core tools::bash::tests
          cargo +stable test --locked -p kloop-core tools::powershell::tests
          cargo +stable test --locked -p kloop-core permissions::tests
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable run --locked -p kloop -- --mock

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: rustc +1.96.1 -Vv
      - run: cargo +1.96.1 -V
      - run: cargo +1.96.1 check --locked --workspace --all-targets --all-features
