# kloop's architecture policy. The gate that reads it is
# crates/cli/tests/architecture.rs; CI reads this file and never writes it.
#
# Only one rule so far: how big a single source file may get. A later rule (say,
# which crate may depend on which) gets its own section rather than more keys in
# this one. Module layering is deliberately not here — Cargo already enforces
# crate dependencies at compile time, and kloop has no domain/app/adapter split
# to declare.

[file_size]
# Ceiling for one non-test file, in code lines. The counting rule — test files
# out, `#[cfg(test)]` items cut out brace-balanced, blank and comment-only lines
# not counted — is pinned down in the gate, and matters more than this number:
# the same files measure 2.5x larger when tests and comments are counted in.
#
# 800 puts the 22 files that are already too big on the ratchet. 600 would drag
# in 33, a batch of them healthy; 1000 would let agent.rs and provider_route.rs,
# the ones currently growing, off the hook.
max_code_lines = 800
