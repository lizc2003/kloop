# kloop provider config — one profile per wire protocol. Copy to
# ~/.kloop/config.toml; kloop requires 0700 on the directory and 0600 on the
# file. Full reference, and the other sections (mcp, hooks, sandbox, shells,
# agents, program, permissions, context), in rust/DESIGN.md.
#
#   mkdir -p ~/.kloop && chmod 700 ~/.kloop
#   cp config/config-demo.toml ~/.kloop/config.toml && chmod 600 ~/.kloop/config.toml

provider = "k-claude"                                   # which one this session starts on


# messages → POST {base_url}/v1/messages    ← base_url carries NO /v1 on this rail
[providers.k-claude]
wire_api    = "messages"
base_url    = "https://gateway.example.com"
auth_header = { Authorization = "Bearer REPLACE-ME" }   # or { x-api-key = "sk-ant-..." }
model       = "claude-opus-4-8"
models      = ["claude-opus-4-8", "claude-sonnet-4-6", "claude-haiku-4-5"]
effort      = "xhigh"
# prompt_cache = true                                   # messages-only; false for a
                                                        # gateway rejecting cache_control

# responses → POST {base_url}/responses
[providers.k-gpt]
wire_api    = "responses"
base_url    = "https://gateway.example.com/v1"
auth_header = { Authorization = "Bearer REPLACE-ME" }
model       = "gpt-5.6-sol"
models      = ["gpt-5.6-sol", "gpt-5.6-terra"]
# context_window = 200000
effort      = "xhigh"

# chat → POST {base_url}/chat/completions
[providers.k-chat]
wire_api    = "chat"
base_url    = "https://gateway.example.com/v1"
auth_header = { Authorization = "Bearer REPLACE-ME" }
model       = "grok-4.5"                           # no `models` = just this one
effort      = "max"

# responses → POST {base_url}/responses
[providers.k-flash]
wire_api    = "responses"
base_url    = "https://gateway.example.com/v1"
auth_header = { Authorization = "Bearer REPLACE-ME" }
model       = "deepseek-v4.1-flash"
models      = ["deepseek-v4-flash-0731", "deepseek-v4.1-flash", "glm-5.3-flash"]
context_window = 1000000
effort      = "xhigh"


# [models."<id>"] — facts about a model, shared by every provider. All optional.
# `context_window` is the model's own window; the budget is the smaller of it and
# the provider's. A provider's `context_window` applies to every model it lists,
# so a model smaller than that MUST say so here — nothing checks it, and until it
# does, predictive compaction budgets it at its siblings' size and never fires.
# A declared `efforts` list is the WHOLE list: leave "none" out and /effort none
# is refused on that model, so list it unless the model really rejects it.
# `max_output_tokens` is the most one call may ask for (default 64000 on messages,
# 65536 on responses/chat). A provider may declare one too, for every model it
# lists; the smaller wins, so a model with a lower hard limit says so here.

[models."claude-opus-4-8"]
context_window = 1000000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

[models."claude-sonnet-4-6"]
context_window = 1000000
efforts = ["none", "low", "medium", "high", "max"]      # no xhigh

# Models that read a token budget instead of an effort field. The keys are this
# model's accepted levels too (plus "none", which is a disabled thinking field
# rather than a budget), so do not also declare `efforts`.
[models."claude-haiku-4-5"]
context_window = 200000                                 # a fifth of what the other two
                                                        # on that provider take
thinking_budget = { low = 2048, medium = 8192, high = 16384 }
max_output_tokens = 64000                               # its hard limit: 64001 is refused

[models."gpt-5.6-sol"]
context_window = 272000                                 # the default; this family can be
                                                        # configured as far as 872000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

[models."gpt-5.6-terra"]
context_window = 272000                                 # same as sol, 872000 max; a
                                                        # sibling's entry does not cover
                                                        # it — undeclared means 200000


# [web] — which search backend web_search calls, and its key. Both halves live
# here; no environment variable is read. web_search is registered only once
# api_key is filled in — until then it is quietly absent, and web_fetch, which
# needs no key, carries on.

[web]
search_provider = "tavily"                              # or "brave"
# api_key       = "tvly-..."                            # tavily free tier: no card


# [env] — variables kloop sets for itself and for every command it runs. A
# name written here wins over the same name in your shell: one file decides
# what this run's environment looks like, so it does not change with whichever
# shell started kloop. Names left out are inherited untouched.

# [env]
# HTTPS_PROXY = "http://127.0.0.1:7897"                 # wins over the shell's
# HTTP_PROXY  = "http://127.0.0.1:7897"
# ALL_PROXY   = "socks5h://127.0.0.1:7897"
# NO_PROXY    = "localhost,127.0.0.1"

# [context] — request_reduction (default on) sends older tool results as short
# stubs pointing at a saved copy, but only once the prompt cache has gone cold
# anyway, so it never costs a cache hit. History itself is never changed:
# turning it off makes the next request whole again.

# [context]
# request_reduction = false
