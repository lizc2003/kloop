# kloop provider config — one profile per wire protocol. Copy to
# ~/.kloop/config.toml; kloop requires 0700 on the directory and 0600 on the
# file. Full reference, and the other sections (mcp, hooks, sandbox, agents,
# codemode, permissions), in rust/README.md.
#
#   mkdir -p ~/.kloop && chmod 700 ~/.kloop
#   cp config/config-demo.toml ~/.kloop/config.toml && chmod 600 ~/.kloop/config.toml

provider = "k-claude"                                   # which one this session starts on


# messages → POST {base_url}/v1/messages    ← base_url carries NO /v1 on this rail
[providers.k-claude]
wire_api    = "messages"
base_url    = "https://gateway.example.com"
auth_header = { Authorization = "Bearer REPLACE-ME" }   # or { x-api-key = "sk-ant-..." }
model       = "claude-opus-4-8"
models      = ["claude-opus-4-8", "claude-sonnet-4-6", "claude-haiku-4-5"]
context_window = 1000000                                # what this gateway caps at
effort      = "xhigh"
# prompt_cache = true                                   # messages-only; false for a
                                                        # gateway rejecting cache_control

# responses → POST {base_url}/responses
[providers.k-gpt]
wire_api    = "responses"
base_url    = "https://gateway.example.com/v1"
auth_header = { Authorization = "Bearer REPLACE-ME" }
model       = "gpt-5.6-sol"
models      = ["gpt-5.6-sol", "gpt-5.6-terra"]
context_window = 258400
effort      = "xhigh"

# chat → POST {base_url}/chat/completions
[providers.k-chat]
wire_api    = "chat"
base_url    = "https://gateway.example.com/v1"
auth_header = { Authorization = "Bearer REPLACE-ME" }
model       = "glm-5.3-flash"                           # no `models` = just this one
effort      = "max"


# [models."<id>"] — facts about a model, shared by every provider. All optional.
# A declared `efforts` list is the WHOLE list: leave "none" out and /effort none
# is refused on that model, so list it unless the model really rejects it.

[models."claude-opus-4-8"]
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

[models."claude-sonnet-4-6"]
efforts = ["none", "low", "medium", "high", "max"]      # no xhigh

# Models that read a token budget instead of an effort field. The keys are this
# model's accepted levels too (plus "none", which is a disabled thinking field
# rather than a budget), so do not also declare `efforts`.
[models."claude-haiku-4-5"]
thinking_budget = { low = 2048, medium = 8192, high = 16384 }

[models."gpt-5.6-sol"]
context_window = 400000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]


# [web] — which search backend web_search calls, and its key. Both halves live
# here; no environment variable is read. web_search is registered only once
# api_key is filled in — until then it is quietly absent, and web_fetch, which
# needs no key, carries on.

[web]
search_provider = "tavily"                              # or "brave"
# api_key       = "tvly-..."                            # tavily free tier: no card
